# OpenEvolve 进化配置（字段名与 openevolve 0.4.0 Config schema 对齐）
# 文档：https://github.com/algorithmicsuperintelligence/openevolve

llm:
  primary_model: "gpt-4o"
  secondary_model: "gpt-4o-mini"
  temperature: 0.8
  max_tokens: 8192

database:
  population_size: 40
  archive_size: 40
  num_islands: 2
  feature_dimensions: []   # M3 阶段接入市场状态分格（MAP-Elites）

evaluator:
  timeout: 300
  cascade_evaluation: false   # 单一 fitness 函数，无需级联

# 进化主循环
max_iterations: 400            # 默认代数 × 种群规模
diff_based_evolution: true
enforce_evolve_blocks: true    # EVOLVE-BLOCK 外的代码强制保护
max_code_length: 20000
checkpoint_interval: 50
log_level: "INFO"
