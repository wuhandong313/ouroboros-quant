# OpenEvolve 进化配置（字段名与 openevolve 0.4.0 Config schema 对齐）
# 文档：https://github.com/algorithmicsuperintelligence/openevolve

llm:
  # DeepSeek OpenAI 兼容接口；key 从 .env 的 DEEPSEEK_API_KEY 读取
  primary_model: "deepseek-chat"
  secondary_model: "deepseek-chat"
  api_base: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  temperature: 0.8
  max_tokens: 8192
  timeout: 120

database:
  population_size: 40
  archive_size: 40
  num_islands: 2
  # MAP-Elites 分格维度；M3 阶段替换为市场状态分格
  feature_dimensions: ["complexity", "diversity"]

evaluator:
  timeout: 300
  cascade_evaluation: false   # 单一 fitness 函数，无需级联

# 进化主循环
max_iterations: 400            # 默认代数 × 种群规模
diff_based_evolution: true
enforce_evolve_blocks: true    # EVOLVE-BLOCK 外的代码强制保护
max_code_length: 20000
checkpoint_interval: 50
log_level: "INFO"
